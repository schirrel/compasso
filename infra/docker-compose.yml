services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_PASSWORD: dev }
    ports: ["5432:5432"]
  mysql:
    image: mysql:8
    environment: { MYSQL_ROOT_PASSWORD: dev }
    ports: ["3306:3306"]
  mongo:
    image: mongo:8
    ports: ["27017:27017"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
