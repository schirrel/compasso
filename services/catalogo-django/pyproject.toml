[project]
name = "catalogo-django"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alan Schio", email = "alanbschio@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "psycopg[binary]>=3.3.9",
    "pyjwt[crypto]>=2.15.1",
]

[project.scripts]
catalogo-django = "catalogo_django:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
